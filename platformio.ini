; root — passive Wi-Fi echolocation (ESP32-S3)
; Open this folder in PlatformIO, or open ci_echolocation/ci_echolocation.ino in Arduino IDE.
;
; Hatari board: ESP32-S3-N16R8 (16 MB flash + 8 MB OPI PSRAM) on CH343 UART (Windows COM6).
; Default env for that board: esp32-s3-n16r8

[platformio]
src_dir = ci_echolocation
default_envs = esp32-s3-n16r8

; N16R8 — CH343 / external UART (recommended for this kit)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DCI_LED_DISABLE=1

; Stock DevKitC-1 profile (8 MB, USB CDC). Keep for other boards.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Generic S3 UART (no CDC). Prefer esp32-s3-n16r8 on the N16R8.
[env:esp32-s3-uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
build_flags =
    -DCORE_DEBUG_LEVEL=0
