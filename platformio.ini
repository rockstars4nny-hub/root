; CI — passive Wi-Fi echolocation (ESP32-S3)
; Open this folder in PlatformIO, or open ci_echolocation/ci_echolocation.ino in Arduino IDE.

[platformio]
src_dir = ci_echolocation

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Generic S3 (no native-USB CDC). Use this env if Serial is silent on the DevKitC profile.
[env:esp32-s3-uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
build_flags =
    -DCORE_DEBUG_LEVEL=0
